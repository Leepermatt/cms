<div class="row">
  <div class="col-md-6">
    <cms-contact-list
      (contactWasSelected)="onContactSelected($event)"
    ></cms-contact-list>
  </div>
  <div class="col-md-6">
    <ng-container *ngIf="selectedContact; else infoText">
      <cms-contact-detail [contact]="selectedContact"></cms-contact-detail>
    </ng-container>
    <ng-template #infoText>
      <p style="color: red">Select a contact to see the details</p>
    </ng-template>
  </div>
</div>
