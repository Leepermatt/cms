<div class="panel panel-default">
  <div class="panel-body">
    <form #f="ngForm" (ngSubmit)="onSubmit(f)" id="contact-edit">
      <!-- CONTACT LIST (DRAG SOURCE) -->
      <div class="row">
        <div class="col-xs-12">
          <h1>Contact List</h1>
          <a
            class="btn btn-success pull-right"
            [routerLink]="['/contacts', 'new']"
          >
            Add Contact
          </a>
        </div>
      </div>
      <hr />
      <div class="row">
        <div
          class="col-xs-12"
          cdkDropList
          #availableContactsList="cdkDropList"
          [cdkDropListData]="contact"
          [cdkDropListConnectedTo]="[groupList]"
        >
          <div
            *ngFor="let contact of groupContacts"
            cdkDrag
            [cdkDragData]="contact"
            style="margin-bottom: 10px"
          >
            <cms-contact-item
              class="col-sm-11"
              [contact]="contact"
            ></cms-contact-item>
          </div>
        </div>
      </div>

      <hr />

      <!-- NAME FIELD -->
      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="name">Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            class="form-control"
            size="120"
            max="120"
            [class.is-invalid]="name.invalid && name.touched"
            [(ngModel)]="contact.name"
            #name="ngModel"
          />
          <div class="invalid-feedback" *ngIf="name.invalid && name.touched">
            Name is required.
          </div>
        </div>
      </div>

      <!-- EMAIL FIELD -->
      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="form-control"
            [class.is-invalid]="email.invalid && email.touched"
            [(ngModel)]="contact.email"
            #email="ngModel"
            maxlength="255"
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
          />
          <div class="invalid-feedback" *ngIf="email.invalid && email.touched">
            Enter a valid email address.
          </div>
        </div>
      </div>

      <!-- PHONE FIELD -->
      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="phone">Phone:</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            pattern="\D*([2-9]\d{2})(\D*)([2-9]\d{2})(\D*)(\d{4})\D*"
            class="form-control"
            [class.is-invalid]="phone.invalid && phone.touched"
            size="150"
            max="255"
            [(ngModel)]="contact.phone"
            #phone="ngModel"
          />
          <div
            class="alert alert-danger"
            *ngIf="phone.invalid && phone.touched"
          >
            Enter a valid phone number.
          </div>
        </div>
      </div>

      <!-- IMAGE URL -->
      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="imageUrl">Image URL:</label>
          <input
            type="text"
            id="imageUrl"
            name="imageUrl"
            class="form-control"
            size="150"
            max="255"
            [(ngModel)]="contact.imageUrl"
          />
        </div>
      </div>

      <!-- GROUP CONTACTS (DROP TARGET) -->
      <div
        class="row"
        id="groupList"
        cdkDropList
        #groupList="cdkDropList"
        [cdkDropListData]="groupContacts"
        [cdkDropListConnectedTo]="[availableContactsList]"
        (cdkDropListDropped)="onDrop($event)"
        style="
          min-height: 6rem;
          border: 2px dashed #ccc;
          background: #f9f9f9;
          padding: 1rem;
        "
      >
        <ng-container *ngFor="let contact of groupContacts; let i = index">
          <div
            cdkDrag
            [cdkDragData]="contact"
            class="col-sm-12"
            style="margin-bottom: 1rem"
          >
            <div class="row">
              <div class="col-sm-10">
                <cms-contact-item [contact]="contact"></cms-contact-item>
              </div>
              <div class="col-sm-2 text-right">
                <button
                  class="btn btn-danger deleteButton"
                  (click)="onRemoveItem(i)"
                >
                  X
                </button>
              </div>
            </div>
          </div>
        </ng-container>

        <span
          class="dragMsg"
          *ngIf="groupContacts?.length < 1"
          style="display: block; text-align: center; padding: 1rem; color: #aaa"
        >
          Drag contacts into group here
        </span>
      </div>

      <!-- REQUIRED FIELD WARNING -->
      <div
        class="alert alert-danger"
        *ngIf="
          (name.invalid && name.touched) || (email.invalid && email.touched)
        "
      >
        The Name and Email fields are required.
      </div>

      <div
        cdkDropList
        [cdkDropListData]="groupContacts"
        [cdkDropListConnectedTo]="[availableContactsList]"
        (cdkDropListDropped)="onDrop($event)"
        style="min-height: 100px; border: 2px dashed red; padding: 1rem"
      >
        <div
          *ngFor="let contact of groupContacts"
          cdkDrag
          [cdkDragData]="contact"
          style="padding: 1rem; background: #eee; margin-bottom: 0.5rem"
        >
          {{ contact.name }}
        </div>
      </div>
      <h2>Drag from left to right</h2>

      <div class="row">
        <!-- Source List -->
        <div
          class="col-sm-6"
          cdkDropList
          #availableContactsList="cdkDropList"
          [cdkDropListData]="availableContacts"
          [cdkDropListConnectedTo]="[groupList]"
          style="min-height: 100px; border: 2px solid blue; padding: 10px"
        >
          <div
            *ngFor="let contact of availableContacts"
            cdkDrag
            [cdkDragData]="contact"
            style="margin: 5px; padding: 10px; background: lightblue"
          >
            {{ contact.name }}
          </div>
        </div>

        <!-- Target List -->
        <div
          class="col-sm-6"
          cdkDropList
          #groupList="cdkDropList"
          [cdkDropListData]="groupContacts"
          [cdkDropListConnectedTo]="[availableContactsList]"
          (cdkDropListDropped)="onDrop($event)"
          style="min-height: 100px; border: 2px solid green; padding: 10px"
        >
          <div
            *ngFor="let contact of groupContacts"
            cdkDrag
            [cdkDragData]="contact"
            style="margin: 5px; padding: 10px; background: lightgreen"
          >
            {{ contact.name }}
          </div>
        </div>
      </div>

      <!-- BUTTONS -->
      <div class="row">
        <div class="col-xs-12 btn-toolbar">
          <button class="btn btn-success" type="submit" [disabled]="!f.valid">
            Save
          </button>
          <button class="btn btn-primary" type="button" (click)="onCancel()">
            Cancel
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
