<div class="panel panel-default">
  <div class="panel-body">
    <form #f="ngForm" (ngSubmit)="onSubmit(f)" id="contact-edit">
      <!-- CONTACT LIST (DRAG SOURCE) -->
      <div class="row">
        <div class="col-xs-12">
          <h1>Contact List</h1>
          <a
            class="btn btn-success pull-right"
            [routerLink]="['/contacts', 'new']"
          >
            Add Contact
          </a>
        </div>
      </div>
      <hr />
      <div class="row">
        <div
          class="col-xs-12"
          cdkDropList
          #availableContactsList="cdkDropList"
          [cdkDropListData]="contact"
          [cdkDropListConnectedTo]="[groupList]"
        >
          <div
            *ngFor="let contact of contact"
            cdkDrag
            [cdkDragData]="contact"
            style="margin-bottom: 10px"
          >
            <cms-contact-item
              class="col-sm-11"
              [contact]="contact"
            ></cms-contact-item>
          </div>
        </div>
      </div>

      <hr />

      <!-- NAME FIELD -->
      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="name">Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            class="form-control"
            size="120"
            max="120"
            [class.is-invalid]="name.invalid && name.touched"
            [(ngModel)]="contact.name"
            #name="ngModel"
          />
          <div class="alert alert-danger" *ngIf="name.invalid && name.touched">
            Name is required.
          </div>
        </div>
      </div>

      <!-- EMAIL FIELD -->
      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="form-control"
            [class.is-invalid]="email.invalid && email.touched"
            size="120"
            max="255"
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}$"
            [(ngModel)]="contact.email"
            #email="ngModel"
          />
          <div
            class="alert alert-danger"
            *ngIf="email.invalid && email.touched"
          >
            Enter a valid Email address.
          </div>
        </div>
      </div>

      <!-- PHONE FIELD -->
      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="phone">Phone:</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            pattern="\D*([2-9]\d{2})(\D*)([2-9]\d{2})(\D*)(\d{4})\D*"
            class="form-control"
            [class.is-invalid]="phone.invalid && phone.touched"
            size="150"
            max="255"
            [(ngModel)]="contact.phone"
            #phone="ngModel"
          />
          <div
            class="alert alert-danger"
            *ngIf="phone.invalid && phone.touched"
          >
            Enter a valid phone number.
          </div>
        </div>
      </div>

      <!-- IMAGE URL -->
      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="imageUrl">Image URL:</label>
          <input
            type="text"
            id="imageUrl"
            name="imageUrl"
            class="form-control"
            size="150"
            max="255"
            [(ngModel)]="contact.imageUrl"
          />
        </div>
      </div>

      <!-- GROUP CONTACTS (DROP TARGET) -->
      <div class="row">
        <div class="form-group">
          <label for="groupList">Group Contacts:</label>
          <div
            class="row"
            id="groupList"
            cdkDropList
            #groupList="cdkDropList"
            [cdkDropListData]="groupContacts"
            [cdkDropListConnectedTo]="[availableContactsList]"
            (cdkDropListDropped)="onDrop($event)"
            style="min-height: 3rem"
          >
            <div
              *ngFor="let contact of groupContacts; let i = index"
              cdkDrag
              [cdkDragData]="contact"
              class="col-sm-12"
            >
              <div class="row">
                <div class="col-sm-10">
                  <cms-contact-item [contact]="contact"></cms-contact-item>
                </div>
                <div class="col-sm-2 text-right">
                  <button
                    class="btn btn-danger deleteButton"
                    (click)="onRemoveItem(i)"
                  >
                    X
                  </button>
                </div>
              </div>
            </div>
            <span class="dragMsg" *ngIf="groupContacts?.length < 1">
              Drag contacts into group here
            </span>
          </div>
        </div>

        <!-- REQUIRED FIELD WARNING -->
        <div
          class="alert alert-danger"
          *ngIf="
            (name.invalid && name.touched) || (email.invalid && email.touched)
          "
        >
          The Name and Email fields are required.
        </div>
      </div>

      <!-- BUTTONS -->
      <div class="row">
        <div class="col-xs-12 btn-toolbar">
          <button class="btn btn-success" type="submit" [disabled]="!f.valid">
            Save
          </button>
          <button class="btn btn-primary" type="button" (click)="onCancel()">
            Cancel
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
