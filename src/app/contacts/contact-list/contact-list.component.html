<div class="row">
  <div class="col-xs-12">
    <h1>Contact List</h1>
    <button class="btn btn-success">Add Contact</button>
  </div>
</div>
<hr />
<div class="row">
  <div class="col-xs-12">
    <cms-contact-item
      *ngFor="let contactEl of contacts"
      [contact]="contactEl"
      (contactSelected)="onSelected(contactEl)"
    ></cms-contact-item>
  </div>
</div>
